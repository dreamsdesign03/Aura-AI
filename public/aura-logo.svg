<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="auraGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>
    <linearGradient id="auraInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f00ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark outer background glow -->
  <circle cx="256" cy="256" r="220" fill="#07090e"/>

  <!-- Outer Neon Ring with glow -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#auraGlow)" stroke-width="12" filter="url(#glowEffect)" opacity="0.8"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#auraGlow)" stroke-width="6"/>

  <!-- Ethereal AI Crystal Core -->
  <polygon points="256,116 356,216 256,396 156,216" fill="url(#auraGlow)" opacity="0.95"/>
  <polygon points="256,116 356,216 256,256" fill="url(#auraInner)" opacity="0.6"/>
  <polygon points="256,256 356,216 256,396" fill="#00f2fe" opacity="0.4"/>

  <!-- Orbit Ring -->
  <ellipse cx="256" cy="256" rx="210" ry="70" fill="none" stroke="#00f2fe" stroke-width="4" transform="rotate(-30 256 256)" stroke-dasharray="16 12" opacity="0.9"/>

  <!-- Center Core Sparkle -->
  <circle cx="256" cy="216" r="24" fill="#ffffff" filter="url(#glowEffect)"/>
  <circle cx="256" cy="216" r="12" fill="#00f2fe"/>
</svg>
